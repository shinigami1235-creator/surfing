# Every save in Pages CMS is a push to main. This shrinks any new photos,
# commits the smaller files back, then publishes the site to GitHub Pages.
name: Shrink photos and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shrink photos
        run: |
          pip install --quiet pillow
          python tools/shrink.py

      # GITHUB_TOKEN pushes do not start this workflow again, so this cannot loop
      - name: Commit smaller photos
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add media
          if ! git diff --cached --quiet; then
            git commit -m "Shrink photos"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
