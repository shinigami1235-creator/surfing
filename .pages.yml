# Pages CMS setup: https://pagescms.org

media:
  input: media
  output: media

content:
  - name: photos
    label: Photos
    type: file
    path: content/photos.json
    format: json
    list: true
    fields:
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: spot
        label: Location
        type: string
        description: "Type it as it appears under Spots, for example Macaronis."
      - name: collections
        label: Collections
        type: string
        list: true
        description: "One collection per line, spelled as under Collections, for example Surf Sessions."
      - name: title
        label: Title
        type: string
        description: Optional. Shown on the photo instead of the location.
      - name: description
        label: Description
        type: text
        description: Optional. Shown under the photo when it is open.
      - name: photos
        label: Photos
        type: image
        options:
          multiple:
            max: 200
          unique: true
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: draft
        label: Hide from the site
        type: boolean
        description: Tick to check it on the preview link first. Untick to publish.

  - name: collections
    label: Collections
    type: file
    path: content/collections.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: description
        label: Description
        type: string
        description: "One line under the cover, for example: Drone shots of surf breaks, islands and boats."
      - name: cover
        label: Cover photo
        type: image
        description: Leave empty to use the newest photo in the collection.
      - name: hidden
        label: Hide from the site
        type: boolean

  - name: spots
    label: Spots
    type: file
    path: content/spots.json
    format: json
    list: true
    fields:
      - name: name
        label: Location
        type: string
        required: true
      - name: area
        label: Area
        type: string
        description: "Shown after the collection on each photo, for example Mentawai Islands or Siberut."

  - name: pages
    label: Pages
    type: file
    path: content/pages.json
    format: json
    list: true
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: slug
        label: Page address
        type: string
        description: "Short name used in the menu and the address, for example charters. The front page is home."
      - name: description
        label: Google description
        type: text
        description: One or two sentences shown in Google results.
      - name: hero
        label: Top photo
        type: image
        description: Leave empty for a page with no big photo.
      - name: hero_text
        label: Line under the title
        type: string
      - name: hidden
        label: Hide from the site
        type: boolean
      - name: sections
        label: Sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{kind}: {heading}"
        fields:
          - name: kind
            label: Section type
            type: select
            options:
              values: [Text, Photos and videos, Details, List, Buttons, Enquiry form, Collections, Films, Contact]
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: rich-text
            description: Use the toolbar for bold, italic, headings, lists and links.
          - name: image
            label: Image
            type: image
            description: Text sections only. Shown beside the text.
          - name: photos
            label: Photos
            type: image
            description: Photos and videos sections only.
            options:
              multiple:
                max: 100
              rename: safe
          - name: videos
            label: YouTube links
            type: string
            list: true
            description: Photos and videos sections only.
          - name: items
            label: Lines
            type: string
            list: true
            description: "Details: Label: value. List: one item per line. Text, Buttons and Contact: Button label | link, for example Instagram | @thefluidaperture, Message us | whatsapp or Enquire | contact. Contact with no lines uses the WhatsApp, Instagram and email under Site."
          - name: hidden
            label: Hide this section
            type: boolean

  - name: menu
    label: Menu
    type: file
    path: content/menu.json
    format: json
    list: true
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: link
        label: Link
        type: string
        description: "A page address such as charters, a full web address, whatsapp or email. Leave empty for a dropdown heading."
      - name: hidden
        label: Hide from the menu
        type: boolean
      - name: children
        label: Dropdown items
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: link
            label: Link
            type: string
          - name: hidden
            label: Hide from the menu
            type: boolean

  - name: videos
    label: Films
    type: file
    path: content/videos.json
    format: json
    list: true
    fields:
      - name: url
        label: YouTube link
        type: string
        required: true
        description: Paste the link from YouTube's Share button. Shorts links show as tall videos.
      - name: title
        label: Title
        type: string
      - name: spot
        label: Location
        type: string
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Hide from the site
        type: boolean

  - name: settings
    label: Site
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: tagline
        label: Line above the name
        type: string
      - name: location
        label: Location
        type: string
      - name: whatsapp
        label: WhatsApp number
        type: string
        description: "Country code and number, no spaces. Example: 60123456789"
      - name: instagram
        label: Instagram handle
        type: string
      - name: youtube
        label: YouTube channel link
        type: string
      - name: email
        label: Email
        type: string
