<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf Photography and Films, Mentawai Islands</title>
<meta name="description" content="Surf photos, drone films and boat charters in the Mentawai Islands.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://images.unsplash.com https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
<link rel="preload" href="assets/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="#" data-set="name"></a>
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Main"><ul id="nav-list"></ul></nav>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap foot-row">
    <span>© <span id="year">2026</span> <span data-set="name"></span></span>
    <span data-set="location"></span>
  </div>
</footer>

<dialog class="lb" id="lb" aria-label="Photo viewer">
  <div class="lb-top">
    <span class="lb-count" id="lb-count"></span>
    <button type="button" class="lb-close" id="lb-close">Close</button>
  </div>
  <div class="lb-stage">
    <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo"><span aria-hidden="true">‹</span></button>
    <img id="lb-img" alt="">
    <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo"><span aria-hidden="true">›</span></button>
  </div>
  <div class="lb-bottom">
    <div>
      <p class="lb-cap" id="lb-cap"></p>
      <p class="lb-desc" id="lb-desc"></p>
    </div>
    <a class="btn btn-light" id="lb-ask" href="#" target="_blank" rel="noopener">Ask about this photo</a>
  </div>
</dialog>
</body>
</html>
